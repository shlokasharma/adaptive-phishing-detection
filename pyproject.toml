[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-phishing-detection"
version = "0.1.0"
description = "Adaptive phishing detection using machine learning, specialized agents, explainable AI, and adaptive evidence orchestration."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]